name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core (dbsdk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --filter dbsdk typecheck
      - name: Test (unit + types)
        run: pnpm --filter dbsdk test
      - name: Build (ESM + declarations)
        run: pnpm --filter dbsdk build
      - name: Pack check
        run: pnpm --filter dbsdk pack:check
