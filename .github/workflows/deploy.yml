# Cloudflare Worker deploy of the Blume docs site (apps/web → server build).
# Owned by the deployment agent. Core owns all other workflows.
#
# Architecture (verified 2026-10-06, see deployment/README.md):
#   apps/web --blume build (cloudflare() adapter)--> dist/server/wrangler.json
#   wrangler deploy --> Worker `dbsdk` on https://dbsdk.preetham-981.workers.dev
#   Vercel project `dbsdk` (deployment/proxy/vercel.json) proxies the public
#   domains (dbsdk.com, www.dbsdk.com, database-sdk.dev, www.database-sdk.dev)
#   to the Worker. The Vercel proxy is static config, deployed manually —
#   no Vercel step here.
#
# Requires repo secrets:
#   CLOUDFLARE_API_TOKEN — Workers Scripts Write + Account Settings Read on the
#   dbSDK account (token `dbsdk-workers-deploy`)
#   CLOUDFLARE_ACCOUNT_ID

name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build docs (Cloudflare server build)
        working-directory: apps/web
        run: npm run build

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy -c dist/server/wrangler.json --name dbsdk
